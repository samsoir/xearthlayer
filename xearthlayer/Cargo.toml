[package]
name = "xearthlayer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "xearthlayer"
path = "src/lib.rs"

[dependencies]
ciborium = "0.2"
ddsfile = "0.6"
bcdec_rs = "0.2"
xearthlayer-package = { path = "../xearthlayer-package" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
reqwest.workspace = true
image = "0.25"
# Imagery chunks are decoded straight to RGBA with the JPEG decoder `image`
# itself uses (#390). Keep these at the versions `image` resolves in
# Cargo.lock, so they add no crate and the fast path and its `image` fallback
# decode with the same code: bump them together with `image`.
zune-jpeg = "0.5.13"
zune-core = "0.5.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
tracing-appender = "0.2"
# FUSE library - fuse3 is the active implementation (async multi-threaded)
# Temporary fork: samsoir/fuse3 `master` = upstream master (0.10.0, which carries
# our configurable max_background/congestion_threshold) plus macOS changes:
# reply resilience (upstream PR #137), comma-joined mount options, reply drops
# logged at debug, the MFMount (FSKit) channel transport, the retry of an
# interrupted FSKit receive (samsoir/fuse3#4), and a library-validation hint
# when MFMount cannot be loaded (samsoir/fuse3#5). Required for 0.5.x (macOS
# support) until these ship on crates.io; revert to the published fuse3
# release then. See #155.
# Never rewrite that branch's history: released Cargo.lock files pin its commits.
fuse3 = { git = "https://github.com/samsoir/fuse3", branch = "master", features = ["tokio-runtime", "unprivileged"] }
libc = "0.2"
regex.workspace = true
thiserror = "1.0"
# Night road lights read DSFs, which X-Plane ships in 7z containers (decode only).
sevenz-rust2 = { version = "0.23.0", default-features = false }
dirs = "5.0"
rust-ini = "0.21"
semver.workspace = true
chrono.workspace = true
sha2.workspace = true
futures = "0.3"
bytes = "1.11.0"
dashmap = "6.1"
tokio-util = "0.7"
parking_lot = "0.12"
moka = { version = "0.12", features = ["future", "sync"] }
glob = "0.3"
flate2.workspace = true
tar.workspace = true
rayon.workspace = true
bincode = "1.3"
# Temporary fork: samsoir/intel-tex-rs-2 `macos-platform-load-command` = the
# 0.5.0 release with its prebuilt Darwin ISPC kernels re-linked to carry
# LC_BUILD_VERSION, which silences Xcode's "no platform load command found"
# linker warning on every macOS build. Revert to the crates.io release once
# upstream ships regenerated kernels (Traverse-Research/intel-tex-rs-2).
intel_tex_2 = { git = "https://github.com/samsoir/intel-tex-rs-2", branch = "macos-platform-load-command" }
wgpu = "30"
block_compression = { version = "0.10", default-features = false, features = ["bc15", "wgpu"] }
pollster = "0.4"
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio-tungstenite = { version = "0.24", features = ["connect"] }
nix = { version = "0.31", default-features = false, features = ["fs"] }
memory-stats = "1.2"
tracing-chrome = { version = "0.7", optional = true }
axum = { version = "0.7", optional = true }

[features]
profiling = ["tracing-chrome"]
debug-map = ["dep:axum"]

[dev-dependencies]
# The FUSE passthrough test builds a 7z DSF fixture itself rather than
# depending on the publisher, which would reintroduce the coupling #284 removes.
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress"] }
proptest = "1.4"
rand = "0.9"
tempfile.workspace = true
futures = "0.3"
# Compiles the GPU worker's WGSL in the default tests, with no GPU: parsed,
# validated, and written as MSL and SPIR-V (`dds::gpu_mips`). The version
# wgpu already brings in.
naga = { version = "=30.0.1", features = ["wgsl-in", "msl-out", "spv-out"] }
filetime = "0.2"
