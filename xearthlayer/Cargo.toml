[package]
name = "xearthlayer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "xearthlayer"
path = "src/lib.rs"

[dependencies]
xearthlayer-package = { path = "../xearthlayer-package" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
reqwest.workspace = true
image = "0.25"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
tracing-appender = "0.2"
# FUSE library - fuse3 is the active implementation (async multi-threaded)
# Temporary fork: samsoir/fuse3 `master` = upstream + configurable-background
# (max_background/congestion_threshold) plus macOS reply-resilience and mount-option
# fixes. Required for 0.5.x (macOS support) until these patches ship on crates.io;
# revert to the published fuse3 release then. See #155.
fuse3 = { git = "https://github.com/samsoir/fuse3", branch = "master", features = ["tokio-runtime", "unprivileged"] }
libc = "0.2"
regex.workspace = true
thiserror = "1.0"
dirs = "5.0"
rust-ini = "0.21"
semver.workspace = true
chrono.workspace = true
sha2.workspace = true
futures = "0.3"
bytes = "1.11.0"
dashmap = "6.1"
tokio-util = "0.7"
parking_lot = "0.12"
moka = { version = "0.12", features = ["future"] }
glob = "0.3"
flate2 = "1.0"
rayon.workspace = true
bincode = "1.3"
intel_tex_2 = "0.5"
wgpu = "28"
block_compression = { version = "0.8", default-features = false, features = ["bc15", "wgpu"] }
pollster = "0.4"
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio-tungstenite = { version = "0.24", features = ["connect"] }
nix = { version = "0.31", default-features = false, features = ["fs"] }
memory-stats = "1.2"
tracing-chrome = { version = "0.7", optional = true }
axum = { version = "0.7", optional = true }

[features]
profiling = ["tracing-chrome"]
debug-map = ["dep:axum"]

[dev-dependencies]
# The FUSE passthrough test builds a 7z DSF fixture itself rather than
# depending on the publisher, which would reintroduce the coupling #284 removes.
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["compress"] }
proptest = "1.4"
rand = "0.9"
tempfile.workspace = true
futures = "0.3"
filetime = "0.2"
