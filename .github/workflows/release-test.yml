name: Release Branch CI

on:
  push:
    branches:
      - 'release/*'
  pull_request:
    branches:
      - 'release/*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Run make verify
        run: make verify

  # macOS is a Tier 1 platform. Pinned to macos-15 (Apple Silicon) rather than
  # macos-latest: that label has moved across both OS versions and CPU
  # architectures, and a silent bump would surface as an unexplained failure on
  # an unrelated PR.
  #
  # No dependency-install step is needed. The pinned fuse3 fork is pure Rust
  # (no build.rs / pkg-config / cc) and xearthlayer/build.rs already emits
  # -lc++ for macOS. macFUSE is a runtime dependency only, and cannot mount
  # on hosted runners in any case (its FSKit extension needs a user's approval
  # in System Settings).
  verify-macos:
    name: Verify (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run make verify
        run: make verify

      # The casks the release pushes to the tap, checked as the tap's Audit
      # workflow checks them (brew style, brew audit --strict) before anything
      # is published. The tap's audit runs only after the push, in another
      # repository, so 0.5.1-beta.3 and beta.4 published casks it rejected.
      - name: Check Homebrew casks
        run: scripts/homebrew/check-casks.sh

