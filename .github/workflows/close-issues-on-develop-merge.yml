name: Close Issues on Develop Merge

# GitHub honours closing keywords ("Closes #123") only when the commit reaches
# the repository's DEFAULT branch. Every pull request here targets a
# `develop/*` integration branch, so an issue whose work is finished and merged
# stays open until the release merge to `main`, weeks or months later. That
# makes a milestone unreadable: it reports a fraction of the work actually
# done, and there is no configuration that changes it.
#
# This workflow supplies what GitHub will not: when commits land on a
# `develop/*` branch, the issues they close are closed, with a comment naming
# the merge. The milestone then tracks development against the release, and
# "has it shipped" is answered by the release tag rather than by issue state.
#
# `push` rather than `pull_request_target`. The first version of this workflow
# used `pull_request_target`, to get a writable token on pull requests raised
# from forks. It never ran once. Workflows for `pull_request_target` are read
# from the DEFAULT branch, not from the pull request's base branch, so a file
# living only on `develop/*` is never even registered: the workflow did not
# appear in `/actions/workflows` at all. A workflow written to work around
# "keywords only count on the default branch" was defeated by "the workflow
# must be on the default branch."
#
# `push` has no such requirement, because the workflow is read from the branch
# that was pushed. It also needs no fork exception: a fork's pull request
# becomes a push to `develop/*` in this repository when it is merged, and this
# repository's token does the work. That removes the `pull_request_target`
# attack surface entirely.

on:
  push:
    branches:
      - 'develop/**'

permissions:
  contents: read
  issues: write

jobs:
  close-referenced-issues:
    name: Close Referenced Issues
    runs-on: ubuntu-latest
    steps:
      # Full history: the closing keywords are read from the messages of the
      # commits this push made reachable, which needs more than a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close issues named by closing keywords
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail

          # Which commits to read. Normally the range this push added. A branch
          # creation has no meaningful `before` (it is all zeroes), and a force
          # push can make `before` unreachable, so both fall back to the head
          # commit alone rather than scanning the whole branch and reopening
          # every keyword in its history.
          range=""
          if [ "${CREATED}" = "true" ] || [ "${FORCED}" = "true" ]; then
            echo "Branch created or force pushed; reading the head commit only."
          elif ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous head ${BEFORE} is not reachable; reading the head commit only."
          else
            range="${BEFORE}..${AFTER}"
          fi

          if [ -n "$range" ]; then
            echo "Reading commit messages in ${range}"
            messages="$(git log --format=%B "$range")"
          else
            messages="$(git log -1 --format=%B "${AFTER}")"
          fi

          # A merge commit's own message does not carry the pull request body,
          # so read that too when this push merged one. The keyword is normally
          # in both places; taking the union means either one alone is enough.
          pr_number="$(
            git log -1 --format=%s "${AFTER}" \
              | grep -oE '^Merge pull request #[0-9]+' \
              | grep -oE '[0-9]+' \
            || true
          )"
          if [ -n "$pr_number" ]; then
            echo "Head commit merges PR #${pr_number}; including its body."
            # Untrusted text. It is appended to a variable and piped to grep,
            # never interpolated into the script.
            pr_body="$(gh api "repos/${REPO}/pulls/${pr_number}" --jq '.body // ""' || true)"
            messages="${messages}"$'\n'"${pr_body}"
          fi

          # close/closes/closed, fix/fixes/fixed, resolve/resolves/resolved,
          # case-insensitive, followed by #<number>. "Related to #123" and
          # "See #123" deliberately do not match. The leading
          # (^|[^[:alnum:]_]) is a word boundary and is load-bearing: without
          # it "prefixes #8" matches on the "fixes" inside it. Cross-repository
          # syntax ("Fixes owner/repo#14") does not match, which is intended;
          # this workflow only closes issues in its own repository.
          numbers="$(
            printf '%s' "$messages" \
              | grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
              | grep -oE '[0-9]+' \
              | sort -un \
            || true
          )"

          if [ -z "$numbers" ]; then
            echo "Nothing pushed to ${BRANCH} names an issue to close."
            exit 0
          fi

          echo "Push to ${BRANCH} names: $(echo "$numbers" | tr '\n' ' ')"

          for n in $numbers; do
            if ! item="$(gh api "repos/${REPO}/issues/${n}" 2>/dev/null)"; then
              echo "  #${n}: not found in ${REPO}, skipping"
              continue
            fi

            # The issues endpoint also serves pull requests. A commit that says
            # "Fixes #274" where 274 is itself a PR must not be touched.
            if [ -n "$(printf '%s' "$item" | jq -r '.pull_request // empty')" ]; then
              echo "  #${n}: is a pull request, skipping"
              continue
            fi

            if [ "$(printf '%s' "$item" | jq -r '.state')" = "closed" ]; then
              echo "  #${n}: already closed, skipping"
              continue
            fi

            if [ -n "$pr_number" ]; then
              body="Closed automatically: merged into \`${BRANCH}\` by PR #${pr_number}."
            else
              body="Closed automatically: pushed to \`${BRANCH}\`."
            fi
            body="${body}"$'\n\n'"Commit \`${AFTER}\`."
            body="${body}"$'\n\n'"Closed against \`${BRANCH}\` rather than \`main\`, because GitHub honours closing keywords only on the default branch and this project integrates through \`develop/*\`. Whether the work has shipped is answered by the release tag, not by issue state."

            gh issue comment "$n" --repo "${REPO}" --body "$body"
            gh issue close "$n" --repo "${REPO}" --reason completed
            echo "  #${n}: closed"
          done
