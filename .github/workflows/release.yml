name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # First: Run make verify to gate all builds
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.RELEASE_TAG }}
      version: ${{ steps.tag.outputs.VERSION }}
      prerelease: ${{ steps.tag.outputs.PRERELEASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            RELEASE_TAG="${{ inputs.tag }}"
          else
            RELEASE_TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT
          # Classify unstable pre-release tags (v0.5.0-dev.N / -alpha.N / -beta.N / -rc.N)
          # vs stable tags (v0.4.6). Pre-releases are published to GitHub as
          # prereleases and never marked "Latest"; stable website sync is gated
          # elsewhere (website-sync.yml only fires on version.json changes).
          if [[ "${RELEASE_TAG}" == *-dev.* || "${RELEASE_TAG}" == *-alpha.* || "${RELEASE_TAG}" == *-beta.* || "${RELEASE_TAG}" == *-rc.* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
          echo "Release tag: ${RELEASE_TAG}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Run make verify
        run: make verify

  # Build the release binary once for reuse across Linux tarball and Debian package
  build-binary:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: [verify]
    # Built inside an ubuntu:22.04 container rather than on `ubuntu-latest`.
    # The runner image is not ours to pin: when GitHub moved `ubuntu-latest`
    # from 22.04 to 24.04 our glibc floor rose from 2.34 to 2.39 with no
    # commit, and the .deb and tarball stopped installing on Debian 12 and
    # Ubuntu 22.04 LTS. A container pins the build environment in this repo,
    # where a change to it is reviewable. Both Linux artifacts are cut from
    # this one binary, so this job alone sets the floor for both.
    container:
      image: ubuntu:22.04
    env:
      # Highest glibc symbol version the released binary may require.
      # 2.34 covers Ubuntu 22.04 (2.35), Debian 12 (2.36) and RHEL 9 (2.34).
      GLIBC_FLOOR: "2.34"
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libfuse3-dev \
            curl ca-certificates git binutils

      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      # Fails the release rather than shipping a binary that cannot start on
      # a supported distro. Without this the floor regresses silently and the
      # first report arrives from a user who cannot run the program at all.
      - name: Verify glibc compatibility floor
        run: |
          MAX=$(objdump -T target/release/xearthlayer \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' \
            | sed 's/GLIBC_//' | sort -V -u | tail -1)
          echo "Highest required glibc symbol: $MAX (floor: $GLIBC_FLOOR)"
          if [ "$(printf '%s\n%s\n' "$MAX" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::Binary requires glibc $MAX, above the supported floor $GLIBC_FLOOR."
            echo "::error::It will not start on Ubuntu 22.04, Debian 12 or RHEL 9."
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary
          path: target/release/xearthlayer

  # Package Linux binary tarball (uses pre-built binary)
  package-linux:
    name: Package Linux Binary
    runs-on: ubuntu-latest
    needs: [verify, build-binary]
    steps:
      - uses: actions/checkout@v6

      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: release-binary
          path: target/release

      - name: Package binary
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          chmod +x target/release/xearthlayer
          mkdir -p dist
          cp target/release/xearthlayer dist/
          cp README.md LICENSE dist/
          cd dist
          tar czvf xearthlayer-${RELEASE_TAG}-x86_64-linux.tar.gz xearthlayer README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: dist/*.tar.gz

  # Build .deb package for Debian/Ubuntu (uses pre-built binary)
  # Stable releases only — previews ship the Linux tarball only.
  package-deb:
    name: Package Debian Package
    runs-on: ubuntu-latest
    needs: [verify, build-binary]
    if: ${{ needs.verify.outputs.prerelease != 'true' }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Download release binary
        uses: actions/download-artifact@v8
        with:
          name: release-binary
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/xearthlayer

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb package
        run: |
          cd xearthlayer-cli
          cargo deb --no-build
          mkdir -p ../dist
          cp ../target/debian/*.deb ../dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/*.deb

  # Build .rpm package for Fedora/RHEL/openSUSE
  # Stable releases only — RPM `Version:` forbids the hyphen in pre-release versions.
  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    needs: [verify]
    if: ${{ needs.verify.outputs.prerelease != 'true' }}
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          dnf install -y rust cargo fuse3-devel rpm-build gcc-c++

      - name: Build release binary
        run: cargo build --release

      - name: Build RPM package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Create source tarball
          mkdir -p xearthlayer-${VERSION}
          cp -r * xearthlayer-${VERSION}/ 2>/dev/null || true
          tar czvf ~/rpmbuild/SOURCES/xearthlayer-${VERSION}.tar.gz xearthlayer-${VERSION}

          # Copy spec file and update version
          cp pkg/rpm/xearthlayer.spec ~/rpmbuild/SPECS/
          sed -i "s/^Version:.*/Version:        ${VERSION}/" ~/rpmbuild/SPECS/xearthlayer.spec

          # Build RPM (binary only, skip source RPM)
          rpmbuild -bb ~/rpmbuild/SPECS/xearthlayer.spec

          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/*.rpm dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: dist/*.rpm

  # Prepare AUR package files
  # Stable releases only — AUR `pkgver` forbids the hyphen in pre-release versions.
  #
  # Runs in an Arch container for two reasons: `.SRCINFO` is generated from the
  # PKGBUILD by makepkg rather than hand-written (so the two cannot drift), and
  # the package is actually built with a stock `makepkg.conf` (LTO on), which is
  # the only thing that proves the shipped PKGBUILD links. See issue #222.
  prepare-aur:
    name: Prepare AUR Package
    runs-on: ubuntu-latest
    needs: [verify]
    if: ${{ needs.verify.outputs.prerelease != 'true' }}
    container:
      image: archlinux:base-devel
    steps:
      - name: Install prerequisites
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v6

      - name: Create unprivileged build user
        # makepkg refuses to run as root. NOPASSWD sudo lets `makepkg -s`
        # install the declared depends/makedepends.
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Generate PKGBUILD
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-*) echo "::error::pkgver may not contain a hyphen: $VERSION" && exit 1 ;;
          esac

          mkdir -p pkg/aur

          # Checksum the release tarball, then discard it so makepkg fetches its
          # own copy below — that way the build validates the published URL and
          # the checksum we are about to ship, not a file we already hold.
          curl -fsSL "https://github.com/${{ github.repository }}/archive/${RELEASE_TAG}.tar.gz" \
            -o "pkg/aur/xearthlayer-${VERSION}.tar.gz"
          SHA256=$(sha256sum "pkg/aur/xearthlayer-${VERSION}.tar.gz" | cut -d' ' -f1)
          rm "pkg/aur/xearthlayer-${VERSION}.tar.gz"

          # Template from the single source of truth. Re-authoring the PKGBUILD
          # here is what dropped `options=(!lto)` and broke every Arch build in
          # #222; keep this a sed, never a heredoc.
          sed -e "s/^pkgver=.*/pkgver=${VERSION}/" \
              -e "s/^sha256sums=.*/sha256sums=('${SHA256}')/" \
              pkg/arch/PKGBUILD > pkg/aur/PKGBUILD

          grep -q '^options=(!lto)' pkg/aur/PKGBUILD \
            || { echo "::error::generated PKGBUILD lost options=(!lto)"; exit 1; }

          # pkg/aur is created by this step, as root, after the workspace-wide
          # chown — so it needs its own. makepkg writes src/ and pkg/ here.
          chown -R builder:builder pkg/aur

      - name: Generate .SRCINFO
        working-directory: pkg/aur
        run: sudo -u builder --set-home makepkg --printsrcinfo > .SRCINFO

      - name: Build with stock makepkg.conf
        # The regression gate for #222: a default-configured Arch machine has
        # LTO enabled, and this step fails to link if the flag is ever lost.
        #
        # This is release-blocking — `publish` requires prepare-aur != failure —
        # which is deliberate: shipping a PKGBUILD that cannot build is the very
        # bug this job exists to prevent. A transient pacman-mirror failure will
        # also stop a release; recover with `gh run rerun <id> --failed`, since
        # the tag is immutable and re-runnable.
        working-directory: pkg/aur
        run: sudo -u builder --set-home makepkg -Cf -s --noconfirm

      - name: Upload AUR package files
        uses: actions/upload-artifact@v7
        with:
          name: aur-package
          path: |
            pkg/aur/PKGBUILD
            pkg/aur/.SRCINFO

  # Final job: Create release and upload all assets atomically.
  # Uses !cancelled() + explicit result checks so publish still runs when the
  # stable-only package jobs (deb/rpm/aur) are skipped for a pre-release tag.
  # A skipped `needs` dependency would otherwise skip this job too.
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [verify, package-linux, package-deb, build-rpm, prepare-aur]
    if: >-
      ${{ !cancelled()
      && needs.verify.result == 'success'
      && needs.package-linux.result == 'success'
      && needs.package-deb.result != 'failure'
      && needs.build-rpm.result != 'failure'
      && needs.prepare-aur.result != 'failure' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -ls

      - name: Generate release notes
        id: notes
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # A hand-written notes file for this exact tag wins, if present.
          # Pre-releases need tester-facing guidance — what to look at, what
          # noise to ignore, how to report — which does not belong in the
          # product changelog. Stable tags normally have no such file and
          # fall through to the CHANGELOG extraction below, unchanged.
          # RELEASE_TAG becomes a path component here, and on workflow_dispatch
          # it is caller-supplied, so constrain it to the tag grammar before
          # use — no slashes, no traversal.
          if ! printf '%s' "${RELEASE_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-(dev|alpha|beta|rc)\.[0-9]+)?$'; then
            echo "Tag '${RELEASE_TAG}' is not a recognised release tag; skipping notes-file lookup."
            NOTES_FILE=""
          else
            NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"
          fi
          if [ -n "${NOTES_FILE}" ] && [ -f "${NOTES_FILE}" ]; then
            echo "Using hand-written notes: ${NOTES_FILE}"
            cp "${NOTES_FILE}" release_notes.md
            cat release_notes.md
            exit 0
          fi

          # Extract release notes from CHANGELOG.md if available
          if [ -f CHANGELOG.md ]; then
            # Try to extract notes for this version
            NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | head -n -1)
            if [ -z "$NOTES" ]; then
              NOTES=$(sed -n "/^## ${VERSION}/,/^## /p" CHANGELOG.md | head -n -1)
            fi
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release ${RELEASE_TAG}"
          fi

          # Write to file for use in release body
          echo "$NOTES" > release_notes.md

          echo "Release notes:"
          cat release_notes.md

      - name: Create draft release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # Delete any existing release for this tag (handles manual releases or retries)
          if gh release view "${RELEASE_TAG}" &>/dev/null; then
            echo "Existing release found for ${RELEASE_TAG}, deleting..."
            gh release delete "${RELEASE_TAG}" --yes
          fi

          # Unstable pre-releases are flagged --prerelease and kept off "Latest"
          # so the stable 0.4.x line remains the repo's latest release.
          TITLE="XEarthLayer ${RELEASE_TAG}"
          RELEASE_FLAGS=()
          if [ "${PRERELEASE}" = "true" ]; then
            TITLE="XEarthLayer ${RELEASE_TAG} (pre-release)"
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi

          # Create draft release (not published yet)
          gh release create "${RELEASE_TAG}" \
            --draft \
            "${RELEASE_FLAGS[@]}" \
            --title "${TITLE}" \
            --notes-file release_notes.md

          echo "Draft release created for ${RELEASE_TAG} (prerelease=${PRERELEASE:-false})"

      - name: Upload Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" artifacts/linux-binary/*.tar.gz

      - name: Upload Debian package
        if: ${{ needs.verify.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" artifacts/debian-package/*.deb

      - name: Upload RPM package
        if: ${{ needs.verify.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" artifacts/rpm-package/*.rpm

      - name: Upload AUR package files
        if: ${{ needs.verify.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          # Create a zip of AUR files for easy download
          cd artifacts/aur-package
          zip -r ../../aur-package.zip .
          cd ../..
          gh release upload "${RELEASE_TAG}" aur-package.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          # Now publish the release (make it non-draft)
          gh release edit "${RELEASE_TAG}" --draft=false

          echo "=============================================="
          echo "Release ${RELEASE_TAG} published successfully!"
          echo "=============================================="
          echo ""
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

      # Website notification moved to website-sync.yml (triggers on release/* merge to main)

      - name: Publish to AUR
        if: ${{ needs.verify.outputs.prerelease != 'true' }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "=============================================="
            echo "AUR Package Ready for Manual Submission"
            echo "=============================================="
            echo ""
            echo "AUR_SSH_PRIVATE_KEY secret not configured."
            echo "The PKGBUILD and .SRCINFO files have been uploaded"
            echo "as release artifacts (aur-package.zip)."
            echo ""
            echo "To publish to AUR manually:"
            echo "  1. Download 'aur-package.zip' from the release"
            echo "  2. Clone the AUR repo:"
            echo "     git clone ssh://aur@aur.archlinux.org/xearthlayer.git"
            echo "  3. Extract and copy PKGBUILD and .SRCINFO into the repo"
            echo "  4. Commit and push:"
            echo "     git add PKGBUILD .SRCINFO"
            echo "     git commit -m 'Update to ${VERSION}'"
            echo "     git push"
            echo ""
            echo "To enable automatic AUR publishing:"
            echo "  1. Generate an SSH key: ssh-keygen -t ed25519 -f aur_key -N ''"
            echo "  2. Add public key to your AUR account"
            echo "  3. Add private key as AUR_SSH_PRIVATE_KEY secret in GitHub"
            exit 0
          fi

          echo "Publishing to AUR..."

          # Setup SSH for AUR
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key

          # Configure SSH to use the key for AUR
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
            StrictHostKeyChecking accept-new
          EOF

          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone the AUR repository
          git clone ssh://aur@aur.archlinux.org/xearthlayer.git aur-repo

          # Copy the generated files
          cp artifacts/aur-package/PKGBUILD aur-repo/
          cp artifacts/aur-package/.SRCINFO aur-repo/

          # Commit and push
          cd aur-repo
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}"
          git push

          echo "=============================================="
          echo "AUR Package Published Successfully!"
          echo "=============================================="
          echo "Package: https://aur.archlinux.org/packages/xearthlayer"

          # Cleanup
          rm -f ~/.ssh/aur_key
