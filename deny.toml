# cargo-deny configuration: dependency license check only (#376).
#
# XEarthLayer is GPL-3.0-or-later, so every crate it links must be under a
# license the GPL can absorb. `make licenses` and the CI `Licenses` job run
# `cargo deny check licenses` against the list below.
#
# Before adding a license here, confirm the FSF lists it as compatible with
# GPLv3 (https://www.gnu.org/licenses/license-list.html). Never add EPL-1.0,
# CDDL, the original OpenSSL license, GPL-2.0-only or any non-commercial
# license: none of them can be combined with GPLv3 code.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
    # XEarthLayer's own crates.
    "GPL-3.0-or-later",
    # Permissive licenses compatible with GPLv3.
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Weak copyleft, compatible with GPLv3 (MPL-2.0 section 3.3).
    "MPL-2.0",
]
